# Snorkel defaults. Shell syntax. install.sh copies this file to
# /usr/local/etc/snorkel/snorkel.conf, which the daemon reads; change that
# copy with `just ssid` or `just config`, not this one. The Wi-Fi password is
# never here: it is kept in a root-only file next to the installed copy.

SSID=""                       # set by: just install "<ssid>" / just ssid "<ssid>"
CHANNEL=48                    # start channel; 5 GHz start avoids a band switch
SCAN_CHANNELS=36,40,44,48     # where to look when the AP is lost
HT=1                          # 802.11n association (HT + WMM)
BA=1                          # accept Block Ack (A-MPDU) with a reorder buffer; 0 declines
TX_RATE=MCS3                  # host unicast data, 1 stream; fw ladder MCS3>2>1>0
BASE_RATE=6M                  # broadcast, management and WPA2 handshake: must not be lost
ACK_RATES=0x10                # chip answers (ACK) at 6M only: the AP hears us ~5 dB weaker
IGI_MAX=50                    # DIG ceiling (0x32): AP raw RSSI ~40 + 10, as phydm caps it
IFACE=feth0                   # host-side interface; peer is feth5000
VID=0x2357
PID=0x0138
